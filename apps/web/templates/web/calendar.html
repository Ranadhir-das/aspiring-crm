<section class="panel spaced"><div class="panel-heading"><h2>{{ calendar_label }}</h2><form method="get" class="actions"><label>Month <input type="number" min="1" max="12" name="month" value="{{ calendar_month }}" required style="width:80px"></label><label>Year <input type="number" min="1900" max="2100" name="year" value="{{ calendar_year }}" required style="width:100px"></label><button class="button">Show month</button></form></div><div class="calendar-grid"><strong>Mon</strong><strong>Tue</strong><strong>Wed</strong><strong>Thu</strong><strong>Fri</strong><strong>Sat</strong><strong>Sun</strong>{% for week in calendar_weeks %}{% for day in week %}<div class="calendar-day {% if not day.current %}outside{% endif %} {% if day.today %}today{% endif %}"><span>{{ day.day }}</span>{% if day.name %}<small>{{ day.name }}</small>{% endif %}</div>{% endfor %}{% endfor %}</div></section>
