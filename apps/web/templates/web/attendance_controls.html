<section class="panel form-panel spaced"><h2>Today's attendance</h2><div class="actions spaced"><form method="post" action="{% url 'web:attendance-action' %}" class="actions">{% csrf_token %}<select name="status" aria-label="Attendance mode"><option value="PRESENT">Present in office</option><option value="WFH">Work from home</option><option value="WEEK_OFF">Week off</option></select><input type="text" name="login_remark" placeholder="Attendance Remark (Optional)" maxlength="500" style="min-width: 220px;"><button name="action" value="in" class="button primary">Check in / mark day</button><button name="action" value="out" class="button">Check out</button></form></div></section>
