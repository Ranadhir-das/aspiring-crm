<div class="pagination"><span>{{ records.paginator.count }} records · Page {{ records.number }} of {{ records.paginator.num_pages }}</span><div>{% if records.has_previous %}<a class="button" href="{% querystring page=records.previous_page_number %}">← Previous</a>{% endif %}{% if records.has_next %}<a class="button" href="{% querystring page=records.next_page_number %}">Next →</a>{% endif %}</div></div>
