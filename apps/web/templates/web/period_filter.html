<form class="filters" method="get">{{ filters.non_field_errors }}{% for field in filters %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}{% if source %}<div class="field"><label for="feedback-source">Statistics source</label><select name="source" id="feedback-source"><option value="calls" {% if source == 'calls' %}selected{% endif %}>Recorded calls</option><option value="manual" {% if source == 'manual' %}selected{% endif %}>Manual work reports</option></select></div>{% endif %}<button class="button">Apply filters</button>{% if export %}<button name="export" value="csv" class="button">Export CSV</button>{% endif %}</form>
