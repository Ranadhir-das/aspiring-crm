<section class="panel spaced"><div class="panel-heading"><div><h2>Leads by status</h2><p>Current lead inventory across all batches, including unassigned leads. Independent of the call date filter.</p></div></div><div class="source-list" aria-label="Lead status bar chart">{% for item in status_bars %}<div class="source-row"><div><strong>{{ item.name }}</strong><span>{{ item.value }}</span></div><div class="progress"><span style="width:{{ item.percent }}%;background:{{ item.color }}"></span></div></div>{% endfor %}</div></section>
