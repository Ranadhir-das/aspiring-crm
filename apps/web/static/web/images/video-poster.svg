<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purple-glow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <linearGradient id="play-btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad)" />
  <rect width="1280" height="720" fill="url(#cyan-glow)" />
  <rect width="1280" height="720" fill="url(#purple-glow)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280 M0 400 H1280 M0 480 H1280 M0 560 H1280 M0 640 H1280" />
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720" />
  </g>

  <!-- Dashboard Preview Outline Mockup -->
  <g transform="translate(140, 100)" opacity="0.85">
    <rect width="1000" height="520" rx="20" fill="#0b1329" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.5" />
    <!-- Top Mockup Bar -->
    <rect x="0" y="0" width="1000" height="48" rx="20" fill="#0f1b38" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="68" cy="24" r="6" fill="#10b981" opacity="0.8" />
    <rect x="110" y="14" width="220" height="20" rx="6" fill="#1e293b" />
    <text x="125" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">app.vaani.crm / overview</text>

    <!-- Side navigation mock -->
    <rect x="20" y="68" width="180" height="430" rx="12" fill="#0d1833" stroke="rgba(255,255,255,0.05)" />
    <rect x="36" y="88" width="148" height="28" rx="6" fill="#2563eb" fill-opacity="0.2" />
    <text x="52" y="106" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Overview</text>
    <text x="52" y="146" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Leads Pipeline</text>
    <text x="52" y="182" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Smart Calling</text>
    <text x="52" y="218" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Follow-ups</text>
    <text x="52" y="254" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Performance</text>
    <text x="52" y="290" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Admissions</text>

    <!-- Content cards mock -->
    <!-- Card 1 -->
    <rect x="220" y="68" width="240" height="100" rx="12" fill="#132042" stroke="rgba(255,255,255,0.06)" />
    <text x="240" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">TODAY'S CALLS</text>
    <text x="240" y="134" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700">142</text>
    <text x="320" y="132" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">+18%</text>

    <!-- Card 2 -->
    <rect x="480" y="68" width="240" height="100" rx="12" fill="#132042" stroke="rgba(255,255,255,0.06)" />
    <text x="500" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">INTERESTED LEADS</text>
    <text x="500" y="134" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700">38</text>
    <text x="560" y="132" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Active</text>

    <!-- Card 3 -->
    <rect x="740" y="68" width="240" height="100" rx="12" fill="#132042" stroke="rgba(255,255,255,0.06)" />
    <text x="760" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">CONVERSION RATE</text>
    <text x="760" y="134" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700">26.8%</text>
    <text x="860" y="132" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Peak</text>

    <!-- Main Chart mock -->
    <rect x="220" y="184" width="760" height="314" rx="12" fill="#132042" stroke="rgba(255,255,255,0.06)" />
    <text x="244" y="214" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Lead Conversion &amp; Calling Activity</text>
    <path d="M260 440 C340 410, 420 460, 500 360 C580 260, 660 380, 740 300 C820 220, 900 270, 940 240" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
    <path d="M260 460 C340 440, 420 480, 500 420 C580 340, 660 410, 740 370 C820 320, 900 350, 940 310" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="6 6" />
  </g>

  <!-- Dark translucent overlay to pop the play button -->
  <rect width="1280" height="720" fill="#030712" fill-opacity="0.45" />

  <!-- Center Play Button with Glow -->
  <g transform="translate(640, 360)">
    <!-- Outer pulse glow -->
    <circle r="72" fill="#06b6d4" opacity="0.3" filter="url(#blur-glow)" />
    <!-- Outer button ring -->
    <circle r="52" fill="#0b132b" stroke="url(#play-btn)" stroke-width="3" />
    <!-- Inner play button circle -->
    <circle r="44" fill="url(#play-btn)" />
    <!-- Play Triangle -->
    <polygon points="-8,-16 -8,16 18,0" fill="#ffffff" />
  </g>

  <!-- Video Info Pill & Badge -->
  <g transform="translate(640, 470)">
    <rect x="-180" y="0" width="360" height="42" rx="21" fill="#0f172a" fill-opacity="0.85" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="-150" cy="21" r="5" fill="#10b981" />
    <text x="-135" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">39s Product Tour · See Vaani in Action</text>
  </g>

  <!-- Brand Watermark bottom-right -->
  <g transform="translate(1080, 660)" opacity="0.6">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle">VAANI CRM</text>
  </g>
</svg>
