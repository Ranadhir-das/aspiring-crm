# Nginx site config. Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/aspiring-crm
#   sudo ln -s /etc/nginx/sites-available/aspiring-crm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run this BEFORE certbot (certbot rewrites this file to add the HTTPS server
# block and redirect automatically — see deploy/DEPLOY.md).

server {
    listen 80;
    server_name crm.example.com;

    client_max_body_size 6M;  # enrollment/attendance photos are base64 JSON, ~4MB cap server-side

    location /static/ {
        alias /opt/aspiring-crm/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/aspiring-crm/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
