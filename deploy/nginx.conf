# Nginx site config for Vaani, proxying everything (HTTP + WebSocket chat) to Daphne.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/vaani
#   sudo ln -s /etc/nginx/sites-available/vaani /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This config needs one addition OUTSIDE any server{} block — in the http{}
# block of /etc/nginx/nginx.conf itself — so the WebSocket Upgrade header
# only applies when the client is actually asking to upgrade:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# Run this BEFORE certbot (certbot rewrites this file to add the HTTPS server
# block and redirect automatically — see deploy/DEPLOY.md).

server {
    listen 80;
    server_name vaaniapp.co.in www.vaaniapp.co.in;

    client_max_body_size 6M;  # enrollment/attendance/report photos are base64 JSON, ~4MB cap server-side

    location /static/ {
        alias /opt/vaani/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/vaani/daphne.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
