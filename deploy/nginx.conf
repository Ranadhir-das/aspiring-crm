# Nginx site config for Vaani, proxying everything (HTTP + WebSocket chat) to Daphne.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/vaani
#   sudo ln -s /etc/nginx/sites-available/vaani /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This config needs two additions OUTSIDE any server{} block — in the http{}
# block of /etc/nginx/nginx.conf itself:
#
# 1) Connection upgrade map for WebSockets:
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# 2) Sanitized log format that excludes query parameters and referrer credentials (strips tokens/tickets
#    from access logs while preserving request path, status, and response metrics):
#   log_format ws_sanitized '$remote_addr - $remote_user [$time_local] '
#                           '"$request_method $uri $server_protocol" '
#                           '$status $body_bytes_sent "-" '
#                           '"$http_user_agent" '
#                           'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';
#
# Run this BEFORE certbot (certbot rewrites this file to add the HTTPS server
# block and redirect automatically — see deploy/DEPLOY.md).

server {
    listen 80;
    server_name vaaniapp.co.in www.vaaniapp.co.in;

    client_max_body_size 6M;  # enrollment/attendance/report photos are base64 JSON, ~4MB cap server-side

    location /static/ {
        alias /opt/vaani/staticfiles/;
    }

    # Apply this exact location to the live HTTPS server block after Certbot.
    # Exposes only the published APK, never other files in /opt/vaani/dist.
    location = /dist/vaani.apk {
        alias /opt/vaani/dist/vaani.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="vaani.apk"' always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Dedicated recording upload endpoint: allow up to 32M (supports 30 MiB audio file
    # plus multipart/form-data boundary and field overhead) while retaining the global 6M cap for general API endpoints.
    location ~ ^/api/v1/calls/\d+/recording/ {
        client_max_body_size 32M;
        client_body_timeout 180s;
        proxy_read_timeout 180s;
        proxy_pass http://unix:/run/vaani/daphne.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket connections (team chat & live employee locations).
    # Logs use the ws_sanitized format to omit query-string auth tokens/tickets.
    location /ws/ {
        proxy_pass http://unix:/run/vaani/daphne.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        access_log /var/log/nginx/vaani_ws_access.log ws_sanitized;
    }

    location / {
        proxy_pass http://unix:/run/vaani/daphne.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
